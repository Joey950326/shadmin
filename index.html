<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>shadmin</title>
    <script>
      try {
        const persistedApp = window.localStorage.getItem('persist:shadmin-app')
        const parsedApp = persistedApp ? JSON.parse(persistedApp) : null
        const persistedThemeMode = parsedApp?.themeMode
        let themeMode = 'system'

        if (typeof persistedThemeMode === 'string') {
          try {
            themeMode = JSON.parse(persistedThemeMode)
          } catch {
            themeMode = persistedThemeMode
          }
        }

        const isDark = themeMode === 'dark'
          || (themeMode === 'system'
            && window.matchMedia?.('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
      } catch {
        // 读取失败时使用 CSS 默认亮色。
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
